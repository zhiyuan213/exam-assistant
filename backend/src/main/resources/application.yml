server:
  port: ${PORT:8080}
spring:
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: always
app:
  wechat:
    appid: ${WECHAT_APPID:wxbee1bab19364f057}
    secret: ${WECHAT_APPSECRET:}
  demo-login: ${DEMO_LOGIN:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/exam-assistant;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
app:
  demo-login: true
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/exam_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:exam}
    password: ${DB_PASSWORD}
